<!doctype html>
<html lang="en" data-page="users">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="users">
  <div class="app-shell">
    <aside id="sidebarContainer"></aside>
    <div class="app-main">
      <header id="headerContainer"></header>
      <main class="container-fluid py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h1 class="h4 page-title mb-0">Users Management</h1>
          <button id="exportUsersCsv" class="btn btn-sm btn-outline-success">Export CSV</button>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-4"><input id="userSearch" class="form-control" placeholder="Search by name/email"></div>
              <div class="col-md-3">
                <select id="userStatusFilter" class="form-select">
                  <option value="">All Status</option>
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
              <div class="col-md-2"><button id="userFilterBtn" class="btn btn-primary w-100">Apply</button></div>
              <div class="col-md-2"><button id="userResetBtn" class="btn btn-outline-secondary w-100">Reset</button></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><strong>All Users Table</strong></div>
          <div class="card-body">
            <div id="usersLoading" class="d-none text-center py-3"><div class="spinner-border"></div></div>
            <div id="usersEmpty" class="d-none text-secondary py-3 text-center">No users found.</div>
            <div class="table-responsive">
              <table id="usersTable" class="table table-hover align-middle">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr></thead>
                <tbody id="usersBody"></tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <small id="usersPageInfo" class="text-secondary"></small>
              <div class="btn-group">
                <button id="usersPrev" class="btn btn-sm btn-outline-secondary">Prev</button>
                <button id="usersNext" class="btn btn-sm btn-outline-secondary">Next</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="userDetailModal">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Full Details</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 col-lg-4">
              <div class="card h-100">
                <div class="card-body text-center">
                  <div id="userDetailAvatar" class="mx-auto mb-2 rounded-circle d-flex align-items-center justify-content-center" style="width:64px;height:64px;background:#dbeafe;font-weight:700;color:#1d4ed8;">U</div>
                  <h5 id="userDetailName" class="mb-1">-</h5>
                  <div id="userDetailEmail" class="text-secondary small mb-2">-</div>
                  <span id="userDetailStatus" class="badge text-bg-secondary">unknown</span>
                </div>
              </div>
            </div>
            <div class="col-12 col-lg-8">
              <div class="card h-100">
                <div class="card-header"><strong>Profile Information</strong></div>
                <div class="card-body">
                  <div id="userDetailContent" class="small"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="userActivityModal">
    <div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">User Activity</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><ul id="userActivityList" class="list-group"></ul></div></div></div>
  </div>
  <div class="modal fade" id="userEditModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Edit User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="userEditForm">
          <div class="modal-body">
            <input type="hidden" id="editUserId">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Name</label><input id="editUserName" class="form-control"></div>
              <div class="col-md-6"><label class="form-label">Email</label><input id="editUserEmail" type="email" class="form-control"></div>
              <div class="col-md-6"><label class="form-label">Phone</label><input id="editUserPhone" class="form-control"></div>
              <div class="col-md-6"><label class="form-label">Account Type</label><select id="editUserAccountType" class="form-select"><option value="">No change</option><option value="normal">normal</option><option value="organization">organization</option></select></div>
              <div class="col-md-6"><label class="form-label">Status</label><select id="editUserActive" class="form-select"><option value="1">active</option><option value="0">inactive</option></select></div>
              <div class="col-md-6"><label class="form-label">Location</label><input id="editUserLocation" class="form-control"></div>
              <div class="col-md-12"><label class="form-label">Headline</label><input id="editUserHeadline" class="form-control"></div>
              <div class="col-md-12"><label class="form-label">About</label><textarea id="editUserAbout" rows="3" class="form-control"></textarea></div>
            </div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save User</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/users.js"></script>
</body>
</html>
