<!doctype html>
<html lang="en" data-page="data">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Management</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="data">
  <div class="app-shell">
    <aside id="sidebarContainer"></aside>
    <div class="app-main">
      <header id="headerContainer"></header>
      <main class="container-fluid py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h1 class="h4 page-title mb-0">Data Management (Master Access)</h1>
          <button id="exportDataCsv" class="btn btn-sm btn-outline-success">Export CSV</button>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2">
              <div class="col-lg-3 col-md-4">
                <select id="dataResource" class="form-select">
                  <option value="users">users</option>
                  <option value="admins">admins</option>
                  <option value="posts">posts</option>
                  <option value="jobs">jobs</option>
                  <option value="activities">activities</option>
                  <option value="blocks">blocks</option>
                  <option value="reports">reports</option>
                  <option value="feedbacks">feedbacks</option>
                  <option value="app_contents">app_contents</option>
                </select>
              </div>
              <div class="col-lg-6 col-md-5"><input id="dataSearch" class="form-control" placeholder="Search any text in selected table"></div>
              <div class="col-lg-3 col-md-3"><button id="dataLoadBtn" class="btn btn-primary w-100">Load Data</button></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><strong>Dynamic Records Table</strong></div>
          <div class="card-body">
            <div id="dataLoading" class="d-none text-center py-3"><div class="spinner-border"></div></div>
            <div id="dataEmpty" class="d-none text-secondary py-3 text-center">No records found.</div>
            <div class="table-responsive">
              <table id="dynamicDataTable" class="table table-hover align-middle">
                <thead id="dataHead"></thead>
                <tbody id="dataBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="dataEditModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Edit Record</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><input type="hidden" id="dataRecordId"><textarea id="dataRecordJson" class="form-control" rows="16"></textarea></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button id="saveDataRecord" class="btn btn-primary">Save</button></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="dataViewModal">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Full Details & Activity</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 col-lg-6">
              <div class="card h-100">
                <div class="card-header"><strong>Profile Details</strong></div>
                <div class="card-body">
                  <div id="dataViewLoading" class="d-none text-center py-3"><div class="spinner-border"></div></div>
                  <div id="dataViewDetails" class="small"></div>
                </div>
              </div>
            </div>
            <div class="col-12 col-lg-6">
              <div class="card h-100">
                <div class="card-header"><strong>Recent Activity</strong></div>
                <div class="card-body">
                  <ul id="dataViewActivity" class="list-group list-group-flush"></ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/data.js"></script>
</body>
</html>
