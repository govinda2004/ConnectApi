<!doctype html>
<html lang="en" data-page="admins">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admins</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admins">
  <div class="app-shell">
    <aside id="sidebarContainer"></aside>
    <div class="app-main">
      <header id="headerContainer"></header>
      <main class="container-fluid py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h1 class="h4 page-title mb-0">Admin Access Control</h1>
          <button id="openAddAdminModal" class="btn btn-sm btn-primary">Add New Admin</button>
        </div>
        <div class="card">
          <div class="card-header"><strong>Admin Accounts</strong></div>
          <div class="card-body">
            <div id="adminsLoading" class="d-none text-center py-3"><div class="spinner-border"></div></div>
            <div id="adminsEmpty" class="d-none text-secondary py-3 text-center">No admins</div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Permissions</th><th class="text-end">Actions</th></tr></thead>
                <tbody id="adminsBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="adminModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header"><h5 id="adminModalTitle" class="modal-title">Add Admin</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="adminForm">
          <div class="modal-body">
            <input id="adminId" type="hidden">
            <div class="mb-3"><label class="form-label">Name</label><input id="adminName" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input id="adminEmail" type="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Password (for new user only)</label><input id="adminPassword" type="password" class="form-control" placeholder="Set password if this email is new"></div>
            <div class="mb-3"><label class="form-label">Role</label><input id="adminRole" class="form-control" placeholder="super_admin / manager / moderator" required></div>
            <div class="mb-0">
              <label class="form-label">Permissions (Multi-select)</label>
              <select id="adminPermissions" class="form-select" multiple size="8">
                <option value="full_access">full_access</option>
                <option value="users_manage">users_manage</option>
                <option value="admins_manage">admins_manage</option>
                <option value="activity_manage">activity_manage</option>
                <option value="jobs_manage">jobs_manage</option>
                <option value="data_manage">data_manage</option>
                <option value="notifications_send">notifications_send</option>
                <option value="settings_manage">settings_manage</option>
              </select>
              <div class="form-text">Ctrl/Cmd + click for multiple permissions.</div>
            </div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="adminDeleteModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger">Delete Admin</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">Are you sure you want to remove this admin access?</p>
          <div id="adminDeletePreview" class="small text-secondary"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-danger" id="confirmDeleteAdmin" type="button">Delete Admin</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/admins.js"></script>
</body>
</html>
