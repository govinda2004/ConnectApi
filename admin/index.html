<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Admin Login</title>
  <link rel="stylesheet" href="/admin/assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/admin/assets/css/style.css">
</head>
<body class="bg-body-tertiary">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card login-card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4">Super Admin Login</h1>
        <p class="text-body-secondary">Sign in to continue.</p>
        <div id="loginAlert" class="alert d-none"></div>
        <form id="loginForm">
          <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
          <div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div>
          <button id="loginBtn" class="btn btn-primary w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
  </main>
  <script src="/admin/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/js/api.js"></script>
  <script src="/admin/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Auth.isAuthenticated()) location.href = 'dashboard.html';
      const form = document.getElementById('loginForm');
      const alertBox = document.getElementById('loginAlert');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await window.Auth.login({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          });
          location.href = 'dashboard.html';
        } catch (err) {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = err.message || 'Login failed';
        }
      });
    });
  </script>
</body>
</html>
