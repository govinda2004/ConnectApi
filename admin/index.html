<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Admin Login</title>
  <link rel="stylesheet" href="/admin/assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/admin/assets/css/style.css">
</head>
<body class="bg-body-tertiary">
  <main class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card login-card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-4">Super Admin Login</h1>

        <div id="loginAlert" class="alert d-none"></div>
        <div id="dbCheck" class="alert d-none"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" type="email" class="form-control" placeholder="admin@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button id="loginBtn" class="btn btn-primary w-100 py-2" type="submit">Sign In</button>
        </form>

        <div id="setupContainer" class="d-none mt-4">
          <hr>
          <details>
            <summary class="fw-semibold text-primary cursor-pointer">First-time Setup: Create Super Admin</summary>
            <div class="mt-3">
              <p class="text-muted small mb-3">Configure <code>SUPER_ADMIN_SETUP_KEY</code> in Render environment variables to use this feature.</p>
              <form id="bootstrapForm">
                <div class="mb-2">
                  <label class="form-label small">Full Name</label>
                  <input id="bootstrapName" type="text" class="form-control form-control-sm" placeholder="Super Admin">
                </div>
                <div class="mb-2">
                  <label class="form-label small">Email Address</label>
                  <input id="bootstrapEmail" type="email" class="form-control form-control-sm" required>
                </div>
                <div class="mb-2">
                  <label class="form-label small">New Password</label>
                  <input id="bootstrapPassword" type="password" class="form-control form-control-sm" minlength="6" required>
                </div>
                <div class="mb-3">
                  <label class="form-label small">Setup Key</label>
                  <input id="bootstrapKey" type="password" class="form-control form-control-sm" required>
                </div>
                <button class="btn btn-outline-primary btn-sm w-100" type="submit">Create Super Admin</button>
              </form>
            </div>
          </details>
        </div>
      </div>
    </div>
  </main>

  <script src="/admin/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/admin/assets/js/api.js"></script>
  <script src="/admin/assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Auth.isAuthenticated()) location.href = 'dashboard.html';

      const loginForm = document.getElementById('loginForm');
      const bootstrapForm = document.getElementById('bootstrapForm');
      const alertBox = document.getElementById('loginAlert');
      const dbCheckBox = document.getElementById('dbCheck');
      const setupContainer = document.getElementById('setupContainer');

      // Check Database and Admin Status
      (async () => {
        try {
          const res = await window.API.get('/api/admin/db-check', {}, false);
          const data = res?.data || res;

          if (!data.connected) {
            dbCheckBox.className = 'alert alert-danger d-block';
            dbCheckBox.innerHTML = `<strong>DB Error:</strong> Database connection failed.`;
          } else {
            // Only show setup if no admin exists
            if (!data.has_admin) {
              setupContainer.classList.remove('d-none');
            }
          }
        } catch (err) {
          dbCheckBox.className = 'alert alert-danger d-block';
          dbCheckBox.textContent = 'Unable to verify database status.';
        }
      })();

      // Login Handler
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
          await window.Auth.login({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          });
          location.href = 'dashboard.html';
        } catch (err) {
          alertBox.className = 'alert alert-danger d-block';
          alertBox.textContent = err.message || 'Login failed';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });

      // Bootstrap Handler
      bootstrapForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await window.Auth.bootstrapSuperAdmin({
            name: document.getElementById('bootstrapName').value.trim() || 'Super Admin',
            email: document.getElementById('bootstrapEmail').value.trim(),
            password: document.getElementById('bootstrapPassword').value,
            setup_key: document.getElementById('bootstrapKey').value,
          });
          location.href = 'dashboard.html';
        } catch (err) {
          alertBox.className = 'alert alert-danger d-block';
          alertBox.textContent = err.message || 'Setup failed';
        }
      });
    });
  </script>
</body>
</html>
