<!doctype html>
<html lang="en" data-page="notifications">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Center</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="notifications">
  <div class="app-shell">
    <aside id="sidebarContainer"></aside>
    <div class="app-main">
      <header id="headerContainer"></header>
      <main class="container-fluid py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h1 class="h4 page-title mb-0">Notifications Center</h1>
          <div class="d-flex align-items-center gap-2">
            <span class="badge text-bg-success">Send + Sent Logs</span>
            <button id="openSendNotificationBtn" class="btn btn-sm btn-primary">Send Notification</button>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-3"><input id="notifFilterUser" class="form-control" placeholder="User/Admin"></div>
              <div class="col-md-2"><input id="notifFilterAction" class="form-control" placeholder="Action"></div>
              <div class="col-md-3"><input id="notifFilterSearch" class="form-control" placeholder="Search message/image"></div>
              <div class="col-md-2"><input id="notifFilterFrom" type="date" class="form-control"></div>
              <div class="col-md-2"><input id="notifFilterTo" type="date" class="form-control"></div>
              <div class="col-md-2 d-grid"><button id="notifApplyBtn" class="btn btn-primary">Apply Filter</button></div>
              <div class="col-md-2 d-grid"><button id="notifResetBtn" class="btn btn-outline-secondary">Reset</button></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Sent Admin Notifications</strong>
            <button id="refreshAdminNotices" class="btn btn-sm btn-outline-primary">Refresh</button>
          </div>
          <div class="card-body">
            <div id="notificationsLoading" class="d-none text-center py-3"><div class="spinner-border"></div></div>
            <div id="notificationsEmpty" class="d-none text-secondary py-3 text-center">No notifications found.</div>
            <div class="table-responsive">
              <table class="table table-hover align-middle dashboard-activity-table">
                <thead><tr><th>ID</th><th>Time</th><th>Receiver</th><th>Type</th><th>Message</th><th>Image</th><th class="text-end">Actions</th></tr></thead>
                <tbody id="adminNoticesBody"></tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <small id="notificationsPageInfo" class="text-secondary"></small>
              <div class="btn-group">
                <button id="notificationsPrev" class="btn btn-sm btn-outline-secondary">Prev</button>
                <button id="notificationsNext" class="btn btn-sm btn-outline-secondary">Next</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="notifyModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Send Notification</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="notifyForm">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Mode</label>
                <select id="notifyMode" class="form-select">
                  <option value="single">Send to One User</option>
                  <option value="all">Broadcast to All Users</option>
                </select>
              </div>
              <div class="col-md-6" id="notifyUserWrap">
                <label class="form-label">User</label>
                <select id="notifyUserId" class="form-select">
                  <option value="">Select user</option>
                </select>
              </div>
            </div>
            <div class="row g-3 mt-1">
              <div class="col-12">
                <label class="form-label">Title</label>
                <input id="notifyTitle" class="form-control" placeholder="Title" value="Admin Notice">
              </div>
              <div class="col-12">
                <label class="form-label">Message</label>
                <textarea id="notifyMessage" class="form-control" rows="5" placeholder="Write message..."></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Optional Image</label>
                <input id="notifyImage" type="file" class="form-control" accept="image/*">
                <div class="form-text">Optional image with notification.</div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-success" type="submit" id="notifySendBtn">Send Notification</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="notifEditModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Edit Notification</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="notifEditForm">
          <div class="modal-body">
            <input type="hidden" id="notifEditId">
            <div class="mb-2"><label class="form-label">Type</label><input id="notifEditType" class="form-control"></div>
            <div class="mb-2"><label class="form-label">Message</label><textarea id="notifEditMessage" rows="3" class="form-control"></textarea></div>
            <div><label class="form-label">Image URL</label><input id="notifEditImageUrl" class="form-control"></div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="notifDeleteModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title text-danger">Delete Notification</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <p class="mb-2">Are you sure you want to delete this notification?</p>
          <div id="notifDeletePreview" class="small text-secondary"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button id="confirmNotifDelete" class="btn btn-danger" type="button">Delete</button></div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/notifications.js"></script>
</body>
</html>
