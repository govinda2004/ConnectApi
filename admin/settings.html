<!doctype html><html lang="en" data-page="settings"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings</title><link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css"><link rel="stylesheet" href="assets/css/style.css"></head><body data-page="settings"><div class="app-shell"><aside id="sidebarContainer"></aside><div class="app-main"><header id="headerContainer"></header><main class="container-fluid py-4"><h1 class="h4 mb-3">Settings</h1><div class="row g-3"><div class="col-lg-6"><div class="card"><div class="card-header">Update Profile</div><div class="card-body"><form id="profileForm"><div class="mb-3"><label class="form-label">Name</label><input id="profileName" class="form-control" required></div><div class="mb-3"><label class="form-label">Email</label><input id="profileEmail" type="email" class="form-control" required></div><button class="btn btn-primary" type="submit">Save</button></form></div></div></div><div class="col-lg-6"><div class="card"><div class="card-header">Change Password</div><div class="card-body"><form id="passwordForm"><div class="mb-3"><label class="form-label">Current Password</label><input id="currentPassword" type="password" class="form-control" required></div><div class="mb-3"><label class="form-label">New Password</label><input id="newPassword" type="password" class="form-control" required></div><button class="btn btn-warning" type="submit">Change</button></form></div></div></div><div class="col-12"><div class="card"><div class="card-header">App Settings</div><div class="card-body"><form id="appSettingsForm" class="row g-3"><div class="col-md-4"><label class="form-label">Maintenance</label><select id="maintenanceMode" class="form-select"><option value="false">Disabled</option><option value="true">Enabled</option></select></div><div class="col-md-4"><label class="form-label">Registration</label><select id="registrationEnabled" class="form-select"><option value="true
