<!doctype html>
<html lang="en" data-page="activity">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Logs</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="activity">
  <div class="app-shell">
    <aside id="sidebarContainer"></aside>
    <div class="app-main">
      <header id="headerContainer"></header>
      <main class="container-fluid py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h1 class="h4 page-title mb-0">Activity Logs Center</h1>
          <span class="badge text-bg-primary">Audit + Actions</span>
        </div>

        <div class="card mb-3">
          <div class="card-header"><strong>Activity Filters</strong></div>
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-6"><input id="activityUser" class="form-control" placeholder="User/Admin"></div>
              <div class="col-md-6"><input id="activityAction" class="form-control" placeholder="Action type"></div>
              <div class="col-md-4"><input id="activityFrom" type="date" class="form-control"></div>
              <div class="col-md-4"><input id="activityTo" type="date" class="form-control"></div>
              <div class="col-md-4"><button id="activityFilterBtn" class="btn btn-primary w-100">Apply Filters</button></div>
            </div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div id="activityLoading" class="d-none text-center py-3"><div class="spinner-border"></div></div>
            <div id="activityEmpty" class="d-none text-secondary py-3 text-center">No logs found.</div>
            <div class="table-responsive">
              <table class="table table-hover align-middle dashboard-activity-table">
                <thead><tr><th>ID</th><th>Time</th><th>Actor</th><th>Receiver</th><th>Action</th><th>Meta</th><th class="text-end">Actions</th></tr></thead>
                <tbody id="activityBody"></tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <small id="activityPageInfo" class="text-secondary"></small>
              <div class="btn-group">
                <button id="activityPrev" class="btn btn-sm btn-outline-secondary">Prev</button>
                <button id="activityNext" class="btn btn-sm btn-outline-secondary">Next</button>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div class="modal fade" id="activityViewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Activity Details</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div id="activityViewContent" class="small"></div></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="activityEditModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Edit Activity</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="activityEditForm">
          <div class="modal-body">
            <input type="hidden" id="editActivityId">
            <div class="mb-2"><label class="form-label">Action</label><input id="editActivityAction" class="form-control"></div>
            <div class="mb-2"><label class="form-label">Message</label><textarea id="editActivityMessage" rows="3" class="form-control"></textarea></div>
            <div><label class="form-label">Image URL</label><input id="editActivityImageUrl" class="form-control" placeholder="https://..."></div>
          </div>
          <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="activityDeleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title text-danger">Delete Activity</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <p class="mb-2">Are you sure you want to delete this activity?</p>
          <div id="activityDeletePreview" class="small text-secondary"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cancel</button><button id="confirmDeleteActivity" class="btn btn-danger" type="button">Delete</button></div>
      </div>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/activity.js"></script>
</body>
</html>
